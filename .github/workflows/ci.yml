name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install only the "ci" environment (CPU PyTorch, about 1.8 GB), not the default
      # one with CUDA PyTorch (about 6 GB). The tests need no GPU and download no model:
      # they check the core — statistics, scoring, experiment layout, token selection,
      # gRPC code generation — not model quality.
      - name: Install pixi and the ci environment
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.79.0
          environments: ci
          cache: true

      # A fresh clone has no code generated from vlm.proto; test_proto.py walks that path.
      - name: Run tests
        run: pixi run -e ci test

      - name: Check reproduction script syntax
        run: bash -n speedrun.sh

      # Every number in README.md is generated from results/ by bench/report.py.
      # A result file that changes without the README being regenerated fails here.
      - name: Check README matches the recorded results
        run: pixi run -e ci python -m bench.report --check
